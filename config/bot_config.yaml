feishu:
  enabled: true
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/your_feishu_webhook_token_here"
  secret: ""
  notify_events:
    interview_invite: true
    contact_exchange: true
    daily_summary: true

wechat:
  enabled: true
  channel: "pc_wechat" # pc_wechat (原生电脑端微信直连) / wecom_webhook / pushplus / serverchan
  pc_wechat_target: "文件传输助手" # 推送目标: "文件传输助手" 或指定好友/群名称
  webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your_wecom_key_here"
  pushplus_token: ""
  serverchan_sendkey: ""
  notify_events:
    interview_invite: true
    contact_exchange: true

astrbot:
  enabled: true
  api_url: "http://127.0.0.1:6185/api/message/send"
  token: ""
  message_type: "private"
  target_id: ""
  notify_events:
    interview_invite: true
    resume_dispatch: true
    daily_summary: true

