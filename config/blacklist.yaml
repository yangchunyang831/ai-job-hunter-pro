# ==========================================
# 3. 套路薪资与异常岗位识别规则
# ==========================================
salary_anomaly_rules:
  max_ratio_allowed: 2.3  # 最高/最低薪资比值上限 (如 10k-25k 为 2.5 倍，超标即判定为纯提成虚假薪资)
  min_absolute_salary_k: 15 # 绝对薪资下限

